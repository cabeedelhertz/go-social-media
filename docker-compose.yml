version: "3.9"
services:
  postgres:
    image: postgres:17
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=social_local
    volumes: # Uncomment for persistent data between container resets
      - db:/var/lib/postgresql/data
  redis:
    image: redis
    ports:
      - "6379:6379"
volumes:
  db:
    driver: local